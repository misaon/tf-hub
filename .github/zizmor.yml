rules:
  unpinned-uses:
    config:
      policies:
        # Version tags are pinned enough here; Renovate keeps them current.
        "*": ref-pin
  cache-poisoning:
    ignore:
      # Low-confidence false positive: setup-node only caches when the `cache:` input is set,
      # and the publish job deliberately sets none.
      - release.yml
  use-trusted-publishing:
    ignore:
      # Trusted publishing requires a public repository; planned for the moment the repo opens up.
      - release.yml
