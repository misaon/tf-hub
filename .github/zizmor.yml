rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  cache-poisoning:
    ignore:
      # Low-confidence false positive: setup-node only caches when the `cache:` input is set,
      # and the publish job deliberately sets none.
      - release.yml
  use-trusted-publishing:
    ignore:
      # The publish job already has `id-token: write`; drop NPM_TOKEN and this entry once
      # the trusted publisher is configured on npmjs.com.
      - release.yml
