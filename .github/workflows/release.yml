name: release

on:
  push:
    tags: ["v*"]

# Add `id-token: write` back alongside npm provenance once the repository is public.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      # No caches in the publish job — restored caches could poison the released artifact.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - name: Verify the tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - name: Run the full quality gate
        run: |
          bun run lint
          bun run fmt:check
          bun run knip
          bun run typecheck
          bun test
      - run: bun run build
      - name: Build the standalone binaries
        run: bun scripts/build-release-artifacts.ts
      # Provenance requires a public source repository — re-enable the flag once the repo is public.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish the GitHub release with the binaries
        run: |
          awk '/^## /{count++} count==1' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/release/* \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
